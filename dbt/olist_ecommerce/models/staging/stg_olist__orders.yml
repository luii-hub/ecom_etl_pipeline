models:
  - name: stg_olist__orders
    description: "Staging table for Olist orders data."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        data_tests:
          - not_null
          - unique
      - name: customer_order_id
        description: "Unique identifier for each customer."
        data_tests:
          - not_null
          - unique
      - name: order_status
        description: "Current status of the order (e.g., delivered, shipped)."
        data_tests:
          - accepted_values:
              values: ['delivered', 'shipped', 'invoiced', 'canceled', 'unavailable', 'processing', 'approved', 'created']
              config:
                severity: warn # allows dbt build to continue
                
      - name: purchase_timestamp
        description: "Timestamp when the order was purchased."
      - name: approved_at
        description: "Timestamp when the order was approved."
      - name: delivered_carrier_date
        description: "Timestamp when the order was delivered to the carrier."
      - name: delivered_customer_date
        description: "Timestamp when the order was delivered to the customer."
      - name: estimated_delivery_date
        description: "Estimated delivery date for the order."